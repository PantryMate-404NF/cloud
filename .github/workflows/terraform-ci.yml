name: terraform ci

on:
  pull_request:
    paths-ignore:
      - 'gitops/'
      - 'docs/'
      
permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.0
      
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Vaildate
        run: |
          set -e

          for dir in \
            bootstrap \
            environments/dev/foundation \
            environments/dev/runtime \
            environments/prod/foundation \
            environments/prod/runtime
          do
            echo "validation for $dir"

            if grep -q 'backend "s3"' "$dir/backend.tf" 2>/dev/null; then
              cat > "$dir/ci_backend_override.tf" <<'EOF'
          terraform {
            backend "s3" {
              bucket = "ci-validation-placeholder"
              key    = "ci-validation-placeholder.tfstate"
              region = "ap-northeast-2"
            }
          }
          EOF
            fi

            terraform -chdir="$dir" init -backend=false
            terraform -chdir="$dir" validate

            rm -f "$dir/ci_backend_override.tf"
          done

      - name: TFLint Init
        run: tflint --init

      - name: TFLint
        run: |
          tflint \
            --recursive \
            --config "$(pwd)/.tflint.hcl"
      
      - name: Trivy IaC Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'